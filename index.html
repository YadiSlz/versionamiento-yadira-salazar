<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yadira's List App</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Yadira's List App</h1>

    <div class="container">

        <div class="formContainer">
            <h2 class="form-title">Add a Product</h2>

            <div class="field-group">
                <label for="name">Product Name</label>
                <input type="text" id="name" placeholder="Enter product name">
            </div>

            <div class="field-group">
                <label for="price">Price</label>
                <input type="number" id="price" placeholder="Enter price (e.g. 9.99)" min="0.01" step="0.01">
            </div>

            <button id="addProduct">Add Product</button>
        </div>


        <div class="table-wrapper">
            <table id="productsTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Price</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>

                </tbody>
            </table>
        </div>
    </div>


    <footer class="app-footer">
        Hecho por <strong>Yadira Salazar</strong>
    </footer>

    <script src="functions.js"></script>
</body>
</html>
